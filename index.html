<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aznor_31 | المنصة الرسمية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* تخصيص شريط التمرير */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #ff2222; border-radius: 10px; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية ضوئية نيونية نابضة خلف الكرت الرئيسي */
        .bg-glow {
            position: absolute;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(255, 34, 34, 0.15) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: pulseGlow 6s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(0.9); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
        }

        /* الكرت الرئيسي المتجاوب مع الهواتف والشاشات */
        .profile-card {
            width: 100%;
            max-width: 450px;
            background: rgba(12, 12, 12, 0.8);
            border: 1px solid rgba(255, 34, 34, 0.25);
            border-radius: 32px;
            padding: 45px 25px 35px 25px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), 0 0 40px rgba(255, 34, 34, 0.05);
            text-align: center;
            z-index: 1;
            position: relative;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* محاكاة اللوغو الخاص بك بدقة عالية */
        .logo-wrapper {
            margin-bottom: 25px;
            position: relative;
            display: inline-block;
        }

        .logo-star {
            color: #ff2222;
            font-size: 1.6rem;
            text-shadow: 0 0 12px #ff2222, 0 0 25px #ff0000;
            animation: pulseStar 2s infinite alternate linear;
            margin-bottom: -5px;
        }

        @keyframes pulseStar {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .logo-text {
            font-family: 'Orbitron', 'Cairo', sans-serif;
            font-size: 3.2rem;
            font-weight: 900;
            color: #ff2222;
            font-style: italic;
            text-shadow: 0 0 10px #ff2222, 0 0 25px #ff0000, 0 0 50px rgba(255,0,0,0.4);
            line-height: 1.1;
            letter-spacing: -1px;
        }

        /* الخط المنحني أسفل الإسم تماماً مثل صورتك */
        .logo-curve {
            width: 90%;
            height: 4px;
            background: #ff2222;
            margin: 6px auto 0 auto;
            border-radius: 50%;
            box-shadow: 0 3px 12px #ff2222;
        }

        /* الوصف الصغير (Bio) */
        .bio-text {
            font-size: 0.95rem;
            color: #cccccc;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 400;
            padding: 0 10px;
        }

        /* عنوان قسم الخدمات المميزة */
        .services-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #777;
            margin-bottom: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .services-title::before, .services-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
        }

        /* شبكة الخدمات المحدثة بخدمتين فقط */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 35px;
        }

        .service-item {
            background: rgba(255, 34, 34, 0.03);
            border: 1px solid rgba(255, 34, 34, 0.15);
            border-radius: 16px;
            padding: 18px 10px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .service-item i {
            font-size: 1.5rem;
            color: #ff2222;
            filter: drop-shadow(0 0 6px rgba(255, 34, 34, 0.6));
        }

        .service-item:hover {
            background: rgba(255, 34, 34, 0.1);
            border-color: #ff2222;
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(255, 34, 34, 0.15);
            color: #ffffff;
        }

        /* حاوية أزرار السوشيال ميديا */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* الأزرار الديناميكية المرتفعة بتأثير توهج قوي */
        .dynamic-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 25px;
            background: #111111;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50px;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            position: relative;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .button-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .dynamic-button i.main-icon {
            font-size: 1.4rem;
            transition: transform 0.3s ease;
        }

        .dynamic-button .chevron-icon {
            font-size: 0.8rem;
            opacity: 0.3;
            transition: all 0.3s ease;
        }

        /* تأثير الحركة والديناميكية المرتفعة جداً عند التمرير بالماوس */
        .dynamic-button:hover {
            transform: translateY(-8px) scale(1.02);
            background: #ff2222;
            color: #050505;
            border-color: #ff2222;
            box-shadow: 0 15px 30px rgba(255, 34, 34, 0.4), 0 0 20px rgba(255, 34, 34, 0.2);
            font-weight: 800;
        }

        .dynamic-button:hover i.main-icon {
            transform: scale(1.25) rotate(-8deg);
        }

        .dynamic-button:hover .chevron-icon {
            opacity: 1;
            transform: translateX(-5px);
            color: #050505;
        }

        /* أسفل الصفحة */
        .footer-badge {
            margin-top: 35px;
            font-size: 0.75rem;
            color: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .footer-badge i {
            color: #ff2222;
            animation: pulseHeart 1s infinite alternate;
        }

        @keyframes pulseHeart {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.2); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

        <div class="logo-wrapper">
            <div class="logo-star">✦</div>
            <div class="logo-text">aznor_31</div>
            <div class="logo-curve"></div>
        </div>

        <p class="bio-text">
            محرر مرئي وصانع محتوى إبداعي. أساعدك في تحويل أفكارك ولقطاتك العادية إلى روائع بصرية سينمائية تجذب الانتباه وتنتشر بسرعة!
        </p>

        <div class="services-title">الخدمات</div>
        <div class="services-grid">
            <div class="service-item">
                <i class="fa-solid fa-clapperboard"></i>

            <div class="service-item">
                <i class="fa-solid fa-rectangle-ad"></i>

        </div>

        <div class="links-container">
            <a href="https://youtube.com/@aznor_31?si=pNPqAR7ktKpGDXOs" target="_blank" class="dynamic-button">
                <div class="button-content">
                    <i class="fa-brands fa-youtube main-icon"></i>
                    <span>يوتيوب / YouTube</span>
                </div>
                <i class="fa-solid fa-chevron-left chevron-icon"></i>
            </a>

            <a href="https://www.tiktok.com/@aznor_31?_r=1&_t=ZS-987fTHoSRJg" target="_blank" class="dynamic-button">
                <div class="button-content">
                    <i class="fa-brands fa-tiktok main-icon"></i>
                    <span>تيك توك / TikTok</span>
                </div>
                <i class="fa-solid fa-chevron-left chevron-icon"></i>
            </a>

            <a href="https://www.instagram.com/aznor___31?igsh=OHNjdWU1MGpneHRq" target="_blank" class="dynamic-button">
                <div class="button-content">

            <a href="https://wa.me/YOUR_PHONE_NUMBER" target="_blank" class="dynamic-button">

                </div>

            </a>
        </div>

        <div class="footer-badge">
            <span>تطوير وإبداع</span>
            <i class="fa-solid fa-heart"></i>
            <span>aznor_31 &copy; 2026</span>
        </div>
    </div>

</body>
</html>
