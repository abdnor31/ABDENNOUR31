<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name='viewport' content='width=device-width, initial-scale=1'/>
  <title>صفحتي الشخصية</title>
  <meta name="description" content="صفحة شخصية بسيطة مع روابط مواقع التواصل الاجتماعي" />
  <style>
    :root{
      --bg: #0f1220;
      --card: #151933;
      --text: #eef2ff;
      --muted: #9aa3b2;
      --accent: #6c8cff;
      --ring: rgba(108,140,255,.35);
      --btn: #1b2147;
      --btn-hover: #222a59;
      --shadow: 0 10px 30px rgba(0,0,0,.25), 0 6px 12px rgba(20,30,60,.25);
    }
    .light{
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #0f1220;
      --muted: #5c667a;
      --accent: #3b5bfd;
      --ring: rgba(59,91,253,.25);
      --btn: #eef1ff;
      --btn-hover: #e2e7ff;
      --shadow: 0 8px 24px rgba(15,18,32,.08), 0 2px 6px rgba(15,18,32,.06);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, "Noto Kufi Arabic", "Noto Sans Arabic", "Almarai", sans-serif;
      background: radial-gradient(1200px 800px at 80% -10%, rgba(108,140,255,.18), transparent 40%),
                  radial-gradient(900px 700px at -10% 110%, rgba(108,140,255,.18), transparent 40%),
                  var(--bg);
      color: var(--text);
      display:flex;align-items:center;justify-content:center;
      padding: 32px 16px;
      transition: background .3s, color .3s;
    }
    .container{width:min(980px,96vw)}
    .card{
      background: linear-gradient(180deg, color-mix(in oklab, var(--card) 92%, #000 8%), var(--card));
      border: 1px solid color-mix(in oklab, var(--card) 80%, transparent);
      box-shadow: var(--shadow);
      border-radius: 16px;
      padding: 22px;
      position:relative;
      overflow:hidden;
      backdrop-filter: blur(6px);
      transition: background .3s, border .3s, box-shadow .3s;
    }
    .header{display:flex;gap:16px;align-items:center}
    .avatar{width:88px;height:88px;border-radius:16px;background:linear-gradient(135deg,#6d7cff,#8fb0ff);border:2px solid var(--ring);overflow:hidden}
    .title{display:flex;flex-direction:column}
    h1{font-size:20px;margin:0}
    .subtitle{color:var(--muted);font-size:13px}
    .about{color:var(--muted);margin-top:12px;line-height:1.6}

    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
    @media (max-width:600px){.grid{grid-template-columns:1fr}}

    .social-btn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--btn);text-decoration:none;color:var(--text);border:1px solid transparent;transition:transform .15s ease,box-shadow .15s ease}
    .social-btn:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.25);border-color:var(--ring)}
    .social-icon{width:28px;height:28px;flex:none}
    .social-label{font-weight:700}
    .social-hint{margin-right:auto;color:var(--muted);font-size:13px}

    .footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:13px}

    /* زر ON/OFF */
    .toggle-btn{
      padding: 8px 16px;
      border-radius: 20px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: transform .2s;
    }
    .toggle-btn:hover{transform: scale(1.05);}
  </style>
</head>
<body>

      <div class="footer">

    </section>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    const btn = document.getElementById('themeToggle');
    btn.addEventListener('click', () => {
      document.body.classList.toggle('light');
      btn.textContent = document.body.classList.contains('light') ? 'نهار' : 'ليل';
    });
